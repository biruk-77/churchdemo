name: Release APK Only

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Build & Release APK Only
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Localizations
        run: flutter gen-l10n

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --dart-define=CHAPA_SECRET_KEY=${{ secrets.CHAPA_SECRET_KEY }} \
            --dart-define=TELEBIRR_APP_KEY=${{ secrets.TELEBIRR_APP_KEY }}

      - name: Prepare APK Asset
        id: prep
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" == "main" || -z "$TAG_NAME" ]]; then
            TAG_NAME="v1.0.0-$(date +'%Y%m%d-%H%M%S')"
          fi
          APK_NAME="church-app-release-${TAG_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${APK_NAME}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "apk_path=build/app/outputs/flutter-apk/${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag_name }}
          name: "EOTC Church App Release ${{ steps.prep.outputs.tag_name }}"
          body: |
            ## 📱 EOTC Church App APK Release
            
            **Release Tag:** `${{ steps.prep.outputs.tag_name }}`  
            **Build Date:** `${{ github.event.head_commit.timestamp || github.sha }}`

            ### 📥 Download & Install
            1. Download the attached `.apk` file below to your Android device.
            2. Open the `.apk` file to install. *(Allow "Install from unknown sources" if prompted)*.
          files: ${{ steps.prep.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
